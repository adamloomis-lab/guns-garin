[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Ohio tournament page was retired — send anyone with an old link (or the
# GiveButter register URL that lived at /ohio) to the current golf tournament
# page. Netlify processes _redirects rules in order, so this must come before
# the SPA fallback below.
[[redirects]]
  from = "/ohio"
  to = "/golf-tournament"
  status = 301

[[redirects]]
  from = "/ohio/*"
  to = "/golf-tournament"
  status = 301

# The old WordPress site served the scholarship application at this path. Keep
# its link equity (and any printed/QR links) pointed at the rebuilt page.
[[redirects]]
  from = "/flight_scholarship_app"
  to = "/flight-scholarship"
  status = 301

[[redirects]]
  from = "/flight_scholarship_app/*"
  to = "/flight-scholarship"
  status = 301

# Prerendered per-route HTML is served directly (Netlify serves existing files
# before applying this fallback). The fallback only catches client-side routes
# that have no prerendered file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
